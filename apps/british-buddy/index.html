const $=s=>document.querySelector(s);
let cat="all",q="";
let learned=new Set(JSON.parse(localStorage.getItem("bb_learned")||"[]"));
function save(){localStorage.setItem("bb_learned",JSON.stringify([...learned]));}

function speak(text){
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang="en-GB";u.rate=0.92;
    const vs=speechSynthesis.getVoices();
    const v=vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en-gb"))
           ||vs.find(v=>v.lang&&v.lang.toLowerCase().startsWith("en"));
    if(v)u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function filteredIdx(){
  const s=q.trim().toLowerCase();
  return DATA.map((d,i)=>({d,i})).filter(({d})=>{
    if(cat!=="all"&&d.c!==cat)return false;
    if(!s)return true;
    return (d.zh+" "+d.us+" "+d.uk).toLowerCase().includes(s);
  });
}

function cardHTML({d,i}){
  const got=learned.has(d.uk);
  return `<article class="card">
    <div class="topline"><span class="uk">${d.uk}</span><span class="pos">${d.pos}</span><button class="say" data-say="${d.uk}">朗读</button></div>
    <div class="ipa">${d.ipa}</div>
    <div class="zh">${d.zh}<span class="us">美式：${d.us}</span></div>
    <div class="ex">“${d.ex}”<button class="say" data-say="${d.ex}">朗读例句</button><div class="exzh">${d.exzh}</div></div>
    ${d.tip?`<div class="tip">${d.tip}</div>`:""}
    <button class="learn${got?" got":""}" data-learn="${i}">${got?"已掌握 ✓":"记住了"}</button>
  </article>`;
}

function render(){
  const list=filteredIdx();
  $("#count").textContent=`共 ${list.length} 个词条 · 已掌握 ${learned.size} 个`;
  $("#cards").innerHTML=list.map(cardHTML).join("")||`<p class="empty">没找到，换个词试试～</p>`;
}

function switchTab(id){
  ["sec-search","sec-flash","sec-me"].forEach(s=>$("#"+s).hidden=(s!==id));
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===id));
  if(id==="sec-me")renderMe();
}

/* 单词卡 */
let cur=-1,flipped=false;
function poolIdx(){
  const p=DATA.map((d,i)=>i).filter(i=>!learned.has(DATA[i].uk));
  return p.length?p:DATA.map((d,i)=>i);
}
function newFlash(){
  const p=poolIdx();
  cur=p[Math.floor(Math.random()*p.length)];
  flipped=false;paintFlash();
}
function paintFlash(){
  const d=DATA[cur];
  $("#fInner").innerHTML=flipped
    ?`<div class="f-uk">${d.uk}</div><div class="ipa" style="margin-top:6px">${d.ipa}</div><div class="f-ex">“${d.ex}”<br><span style="color:#999;font-size:13px">${d.exzh}</span></div><div style="margin-top:10px"><button class="say" data-say="${d.uk}">朗读</button><button class="say" data-say="${d.ex}">朗读例句</button></div>`
    :`<div class="f-zh">${d.zh}</div><div class="f-hint">美式：${d.us} · ${CATS[d.c]}<br>点卡片翻面，看英式说法</div>`;
  $("#fCount").textContent=`剩余未掌握 ${DATA.length-learned.size} / ${DATA.length}`;
}

/* 我的进度 */
function renderMe(){
  $("#mTotal").textContent=DATA.length;
  $("#mGot").textContent=learned.size;
  const pct=Math.round(learned.size/DATA.length*100);
  $("#mBar").style.width=pct+"%";
  $("#mPct").textContent=pct+"%";
  $("#learnedList").innerHTML=[...learned].map(uk=>{
    const d=DATA.find(x=>x.uk===uk);
    return d?`<div class="lrow"><span><b>${d.uk}</b> · ${d.zh}</span><button data-unlearn="${d.uk}">取消</button></div>`:"";
  }).join("")||`<p class="empty">还没有掌握的词条，去单词卡里记几个吧～</p>`;
}

document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]");
  if(say){speak(say.dataset.say);return;}
  const learn=e.target.closest("[data-learn]");
  if(learn){const d=DATA[+learn.dataset.learn];learned.has(d.uk)?learned.delete(d.uk):learned.add(d.uk);save();render();return;}
  const tab=e.target.closest("[data-tab]");
  if(tab){switchTab(tab.dataset.tab);return;}
  const chip=e.target.closest("[data-chip]");
  if(chip){cat=chip.dataset.chip;document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===chip));render();return;}
  const un=e.target.closest("[data-unlearn]");
  if(un){learned.delete(un.dataset.unlearn);save();render();renderMe();return;}
});

$("#flash").addEventListener("click",()=>{flipped=!flipped;paintFlash();});
$("#btnHard").addEventListener("click",ev=>{ev.stopPropagation();newFlash();});
$("#btnNext").addEventListener("click",ev=>{ev.stopPropagation();newFlash();});
$("#btnKnow").addEventListener("click",ev=>{ev.stopPropagation();learned.add(DATA[cur].uk);save();newFlash();render();});
$("#btnReset").addEventListener("click",()=>{if(confirm("确定清空已掌握记录吗？")){learned.clear();save();render();renderMe();newFlash();}});
$("#q").addEventListener("input",e=>{q=e.target.value;render();});

/* init */
$("#chips").innerHTML=Object.entries(CATS).map(([k,v])=>`<button class="chip${k==="all"?" on":""}" data-chip="${k}">${v}</button>`).join("");
try{speechSynthesis.getVoices();}catch(e){}
render();renderMe();newFlash();
</script>
