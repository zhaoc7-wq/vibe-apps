<h1>艺术疗愈小工具 · 还在构思中</h1>
<p>备选方向：</p>
<ul>
<li><b>情绪涂鸦日记</b>：每天画一幅小涂鸦，配一句引导语，记录情绪变化曲线。</li>
<li><b>艺术疗愈练习库</b>：一套带步骤的疗愈练习（曼陀罗、情绪色彩、自画像等），跟着做就行。</li>
<li><b>作品情绪档案</b>：上传作品，标注当时的情绪和想法，沉淀成个人疗愈档案。</li>
</ul>
